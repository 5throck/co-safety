key_hazards:
  - 25kV 전차선 활선 접촉 감전 (catenary live-line electrocution)
  - 선로 내 작업자 접촉 사고 (track worker struck-by)
  - 터널/지하구간 밀폐공간 질식 (tunnel confined space asphyxiation)
  - 열차 접근 시 대피 불가 (train approach — no escape route)
inspection_cycles:
  catenary_inspection: 야간 점검 (notulldig — 전차선 정전 구간)
