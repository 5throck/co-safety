  annex_status: "VERIFIED 2026-08-24 — 이미지 별표였던 별표 5 전문을 law.go.kr 공식 첨부 PDF에서 pypdf 텍스트 추출로 취득 (시행규칙 <제정 2025.10.1>, 별표 5 PDF flSeq=158962473, 제44조·제45조제2항·제46조제1항 관련) [Source: https://www.law.go.kr/LSW/flDownload.do?flSeq=158962473 ; accessed 2026-08-24]"
  verified_distances: "별표 5 가목 배치기준: 수소저장설비 겉면→보호시설(도시가스사업법시행규칙 별표 1 따른) 저장능력별(m³) 제1종 17m(≤1만)/21m(1–2만)/24m(2–3만)/27m(3–4만)/30m(>4만), 제2종 12/14/16/18/20m; 방호벽 설치 저장설비는 제외; 수소가스설비→화기취급장소 8m 우회거리(연료전지 건축물 내 연료전지·배관은 2m) 또는 누출 유동방지 조치; 산소저장설비 주위 5m 이내 화기 금지"
  cross_check_note: "고시 특례기준 수치와 교차검증 — R&D용 이동 충전차량~보호시설 17m(1종)/12m(2종)은 별표 5 최소 저장능력 계단(17m/12m)과 정확히 일치 (별표 5 파생 확인). 융·복합충전소 고시의 8m/6m·도로경계 5m·철도 30m는 별표 5와 별개 법령(특례기준) 수치로 상충 없음"
  verified_special_rules: "융·복합충전소 및 패키지형, 이동식 수소연료 충전시설의 시설기준 등에 관한 특례기준(산업통상부 고시 2025-76): 처리·저장설비~사업소경계 규정거리 8m(상용압력 >40MPa)/6m(≤40MPa), 도로경계 5m, 철도 30m, 화기 8m/6m. 수소자동차 충전소시설기준 및 기술기준 등에 관한 특례기준(R&D용): 이동 충전차량~보호시설 17m(1종)/12m(2종)"
  prior_value_note: "종전 '15-30m (학교/병원 등)' 수치는 캐시 어느 문서에서도 확인 불가 — 삭제"
