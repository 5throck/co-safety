source_mcp: mcp-kr-legislation
jurisdiction: KR
regulator: MOLIT (국토교통부)
framework: Construction-Technology-Act
title_ko: 건설기술진흥법
title_en: Construction Technology Promotion Act
primary_law:
  name_ko: 건설기술진흥법
  name_en: Construction Technology Promotion Act
  articles:
    - article: "62"
      topic_ko: 건설공사 안전관리
      topic_en: Construction safety management
    - article: "55"
      topic_ko: 건설공사 품질관리
      topic_en: Construction quality management
safety_supervision:
  name_ko: 안전감리
  independence: "건설사업관리기술인 (감리)의 독립성 보장"
  scope: "시공단계 품질·안전관리 실태 확인, 설계변경 확인, 준공검사 등 발주청 감독 권한대행 (법 제39조②); 재해예방대책 확인·안전관리계획 검토·확인 및 안전관리·환경관리 지도 (시행령 제58조③5호); 건축공사 감리세부기준(국토교통부 고시 2024-377) §2.5.6 — 안전관리계획 사전검토·실시확인·평가·기록유지, 안전관리자 현장 배치여부 확인, 작업계획서 기반 시공 전 안전조치 이행여부 확인. 종전 '안전점검 회의 참석' 문구는 캐시 문서에서 근거 미확인으로 삭제"
  conflict_prevention: "안전관리자와 안전감리의 역할 분리"
major_threshold: "품질관리계획 대상: 총공사비 500억 원 이상 등 (시행령 제89조); 안전관리계획 대상: 1·2종 시설물, 지하 10m 이상 굴착, 10층 이상 건축물 등 (시행령 제98조). '공사금액 100억 원'은 산업안전보건법 제42조 유해위험방지계획 기준"
last_updated: "2026-08-24"
