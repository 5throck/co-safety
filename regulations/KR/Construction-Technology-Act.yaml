safety_supervision:
  name_ko: 안전감리
  independence: "건설사업관리기술인 (감리)의 독립성 보장"
  scope: "안전관리계획서 적합성, 시공 중 안전조치, 안전점검 회의 참석"
  conflict_prevention: "안전관리자와 안전감리의 역할 분리"
major_threshold: "품질관리계획 대상: 총공사비 500억 원 이상 등 (시행령 제89조); 안전관리계획 대상: 1·2종 시설물, 지하 10m 이상 굴착, 10층 이상 건축물 등 (시행령 제98조). '공사금액 100억 원'은 산업안전보건법 제42조 유해위험방지계획 기준"
