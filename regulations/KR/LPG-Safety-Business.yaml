source_mcp: mcp-kr-legislation
jurisdiction: KR
regulator: 산업통상부 / KGS
framework: LPG-Safety-Business
title_ko: 액화석유가스의 안전관리 및 사업법
title_en: LPG Safety Management and Business Act
primary_law:
  name_ko: 액화석유가스의 안전관리 및 사업법
  articles:
    - article: "29"
      topic_ko: 자동차에 대한 LPG 충전행위의 제한 (충전소 안전)
    - article: "8"
      topic_ko: LPG 저장소 설치 허가 (저장 기준)
    - article: "34"
      topic_ko: 안전관리자 선임 (LPG)
    - article: "45"
      topic_ko: 상세기준 위임 — 시설·기술·검사 세부기준 (KGS Code)
    - article: "36"
      topic_ko: 안전성 확인 및 완성검사 (공사인허가·완성검사)
charging_stations:
  count_korea: 1200+
  regulatory_distance:
    basis: "저장설비~보호시설·사업소경계 거리표는 액화석유가스의 안전관리 및 사업법 시행규칙 별표 4(충전)·별표 5(저장소)에 규정 — 허가관청이 경계측량 성과도로 거리 확보를 확인 (시행규칙 제11조③)"
    status: "VERIFIED 2026-08-24 — 이미지 별표였던 별표 4·5 전문을 law.go.kr 공식 첨부 PDF에서 pypdf 텍스트 추출로 취득 (<개정 2025.11.28.> 현행본; 별표 4 PDF flSeq=160060781, 별표 5 PDF flSeq=160060881) [Source: https://www.law.go.kr/LSW/flDownload.do?flSeq=160060781 , https://www.law.go.kr/LSW/flDownload.do?flSeq=160060881 ; accessed 2026-08-24]"
    verified_distances:
      byeol4_charging_facilities: "별표 4 제1호가목(용기충전): 저장설비→사업소 경계 저장능력별 24m(≤10톤)/27m(10–20)/30m(20–30)/33m(30–40)/36m(40–200)/39m(>200톤), 지하설치·액중펌프는 ×0.7; 충전설비→사업소 경계 24m 이상, 충전기→도로 경계선 4m 이상; 자동차 고정탱크 정차위치 중심→사업소 경계 24m, 정차위치 바깥면→도로 경계선 2.5m; 저장·가스설비→화기취급장소 8m 우회거리"
      byeol4_vehicle_refueling: "별표 4 제2호가목(자동차에 고정된 용기 충전): 저장설비·충전설비→보호시설 저장능력별 제1종 17m(≤10톤)/21m/24m/27m/30m(>40톤), 제2종 12/14/16/18/20m; 지하설치 시 1/2 (1999-04-01 이전 설치 시설 한정 경과규정)"
      byeol5_storage: "별표 5 제1호가목(일반집단공급·저장소): 저장설비(소형저장탱크 제외) 바깥면→사업소 경계 저장능력별 17m(≤10톤)/21m(10–20)/24m(20–30)/27m(30–40)/30m(>40톤), 지하설치 시 1/2; 화기 8m 우회거리 또는 유동방지 조치; 소형저장탱크 가스충전구→토지경계선 0.5m(<1천kg)/3.0m(1–2천kg)/5.5m(≥2천kg), 탱크간 0.3/0.5/0.5m, 건축물 개구부 0.5/3.0/3.5m"
      legacy_claim_check: "종전 '15-50m (학교/병원 등)' 수치는 별표 4·5 어디에도 없음 확인 — 거리표는 모두 저장능력 계단식(경계·보호시설 기준)이며 학교/병원 개별 열은 존재하지 않음 (삭제 판정 재확인)"
    kgs_delegation_note: "세부 시공·검사 방법론은 법 제45조 상세기준(KGS Code, 산업통상부 공고 2020-271) 위임 — 법정거리 자체는 상기 시행규칙 별표 수치표가 근거"
kgs_code_delegation:
  description: "액화석유가스의 안전관리 및 사업법 제45조에 따라 가스기술기준위원회(KGS Code 체계)가 시설·기술·검사의 상세기준을 정하고 산업통상부장관의 승인을 받음"
  covered_by_kgs_code: true
permit_procedure:
  pre_review: "한국가스안전공사 기술검토 — 허가신청 첨부서류 (시행규칙 제15조①, 별지 제16호서식; 종전 '별지 제8호서식' 표기는 가스용품 제조사업 변경신고서로 오기)"
  safety_confirmation: "공정별 안전성 확인 — 저장탱크 지하매설 직전 공정 등 4개 공정 (법 제36조①, 시행규칙 제51조①); '중간검사' 용어는 고압가스법 계열 표현으로 LPG법에는 없음"
  completion_inspection: "허가관청(시장·군수·구청장 등)의 완성검사를 한국가스안전공사에 위탁하여 실시, 합격증명서도 공사 사장 발급 (법 제36조②, 시행령 제32조③4호, 시행규칙 제51조③·⑤) — KGS 입회 관행은 시행령 제32조③의 법정 위탁으로 확인"
  periodic_inspection: "완성검사증명서 최초 발급일 기준 매 1년(전후 30일 이내), 허가관청 검사를 한국가스안전공사에 위탁 (법 제37조①, 시행규칙 제52조③, 시행령 제32조③6호)"
last_updated: "2026-08-24"
