      topic_ko: 산업안전보건관리비 (건설공사 원가의 1.5~5%)
      topic_en: Safety management budget (1.5-5% of project cost)
    - article: "38"
      topic_ko: 건설공사 안전조치 (추락·붕괴·낙하 장소, 굴착 등 — 세부기준은 고용노동부령 위임)
      topic_en: Construction safety measures
    - article: "42"
      topic_ko: 유해위험방지계획서의 작성·제출 (종전 안전보건관리계획 제도 대체)
      topic_en: Hazard prevention plan submission (successor of former safety and health management plan scheme)
related_rule:
  name_ko: 산업안전보건기준에 관한 규칙
  abbreviation: OSHA-KR-Rules
