source_mcp: mcp-kr-legislation
jurisdiction: KR
regulator: MOEL (고용노동부)
framework: OSHA-KR-Construction
title_ko: 산업안전보건법 건설공사 조항
title_en: Occupational Safety and Health Act — Construction Provisions
