  legal_basis_current: "유해위험방지계획서 작성·제출 (법 제42조) / 건설공사발주자 산업재해 예방 조치 (법 제67조)"
  legacy_note: "종전 MOEL 승인형 안전보건관리계획(공사금액 50억원 이상, 착공 전 제출)은 현행 법률에 근거 조항 없음 — 2026-08-24 전체 조문 헤더 검증"
