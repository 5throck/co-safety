    - article: "42"
      topic_ko: 추락의 방지 (난간등·추락방호망·안전대)
      topic_en: Fall prevention
    - article: "154"
      topic_ko: "붕괴 등의 방지 (굴착면 붕괴: 제339조)"
      topic_en: "Collapse prevention (excavation face: Art 339)"
    - article: "304"
      topic_ko: "감전방지 — 누전차단기 등 (전기 위해 방지: 제301조~제323조)"
      topic_en: Electric shock prevention (electrical hazard provisions Arts 301-323)
safety_budget_rates:
