  - 믹서/교반기 LOTO 미이행 (mixer/agitator LOTO failure)
  - 미생물 오염 (microbial contamination)
haccp_basis: HACCP 인증 (식품안전관리인증) per MFDS Notice — Art. 48 codifies mandatory HACCP for designated food businesses
