framework: Food-Sanitation-Act
title_ko: 식품위생법
title_en: Food Sanitation Act (FSA)
primary_law:
  name_ko: 식품위생법
  abbreviation: FSA
  articles:
    - article: "12의2"
      topic_ko: 유전자변형식품 표시
      topic_en: Labeling of genetically modified foods
    - article: "48"
      topic_ko: 식품안전관리인증기준
      topic_en: Food Safety Management Certification Standards (HACCP basis)
related_rule:
  name_ko: 식품위생법 시행령 / 시행규칙 / 식품위생분야종사자의건강진단규칙
