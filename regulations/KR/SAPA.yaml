jurisdiction: KR
regulator: MOEL / MOJ
framework: SAPA
title_ko: 중대재해처벌법 (전체 조항 정본)
title_en: Serious Accidents Punishment Act (SAPA) — Canonical Base
description: >
  Canonical, cross-domain base regulation file consolidating the full 16-article structure
  (Arts 1-16, incl. Art 1 목적 and Art 2 정의 with the 중대재해/중대산업재해 thresholds)
  of 중대재해처벌법 as cited anywhere in the Safety OS codebase. Domain-specific sub-variant
  files (SAPA-Construction.yaml, SAPA-Training.yaml) narrow this list to the articles
  relevant to their domain — this file is the single source of truth for the full set.
  Structure verified via kr_safety MCP (MST=228817); Arts 1-2 re-verified verbatim against
  the legalize-kr cache (.cache/legalize-kr/kr/중대재해처벌등에관한법률/법률.md); see
  regulations/KR/legal-glossary.yaml for the underlying provenance data this file is
  generated from.
primary_law:
  name_ko: 중대재해처벌법
  name_en: Serious Accidents Punishment Act
  abbreviation: SAPA
  structure_note: >
    Ch.1 General (Art 1-2), Ch.2 Serious Industrial Accidents (Art 3-9),
    Ch.3 Serious Civic Disasters (Art 10-11), Ch.4 Supplementary (Art 12-16).
  articles:
    - article: "1"
      topic_ko: 목적
      topic_en: Purpose — punish business owners, management responsible persons, public officials, and corporations whose violation of safety·health measures causes casualties; prevent serious disasters and protect life and body of citizens and workers
    - article: "2"
      topic_ko: 정의
      topic_en: Definitions — 중대재해 = 중대산업재해 + 중대시민재해; 중대산업재해 = OSHA-KR Art 2(1) industrial accident with fatality ≥1, ≥2 injured requiring ≥6 months treatment in one accident, or ≥3 occupational disease patients (acute poisoning etc.) within 1 year from the same hazard factor; also defines 중대시민재해/공중이용시설/공중교통수단/제조물/종사자/사업주/경영책임자등
    - article: "3"
      topic_ko: 적용범위
      topic_en: Application scope — Chapter 2 does not apply to individual business owners or management responsible persons of businesses/workplaces with fewer than 5 regular workers
    - article: "4"
      topic_ko: 사업주와 경영책임자등의 안전 및 보건 확보의무
      topic_en: Safety and health assurance obligation — management system establishment
    - article: "5"
      topic_ko: 도급·용역·위탁 등 관계에서의 안전·보건 확보의무
      topic_en: Obligations for Contract, Lease, and Outsourcing
    - article: "6"
      topic_ko: 중대산업재해 사업주와 경영책임자등의 처벌
      topic_en: Punishment for serious industrial accidents
    - article: "7"
      topic_ko: 중대산업재해의 양벌규정
      topic_en: Dual liability for serious industrial accidents — corporate penalty
    - article: "8"
      topic_ko: 안전보건교육의 수강
      topic_en: Mandatory safety and health education attendance
    - article: "9"
      topic_ko: 중대시민재해 사업주와 경영책임자등의 안전 및 보건 확보의무
      topic_en: Safety and health assurance obligation for civic disasters
    - article: "10"
      topic_ko: 중대시민재해 사업주와 경영책임자등의 처벌
      topic_en: Punishment for serious civic disasters
    - article: "11"
      topic_ko: 중대시민재해의 양벌규정
      topic_en: Dual liability for serious civic disasters — corporate penalty
    - article: "12"
      topic_ko: 형 확정 사실의 통보
      topic_en: Notification of final conviction
    - article: "13"
      topic_ko: 중대산업재해 발생사실 공표
      topic_en: Public disclosure of serious industrial accident occurrence
    - article: "14"
      topic_ko: 심리절차에 관한 특례
      topic_en: Special procedural rules for trials
    - article: "15"
      topic_ko: 손해배상의 책임
      topic_en: Damages liability
    - article: "16"
      topic_ko: 정부의 사업주 등에 대한 지원 및 보고
      topic_en: Government support and reporting requirements
